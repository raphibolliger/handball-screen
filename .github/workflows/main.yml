name: 📦 Create and Publish Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: 📥 Build Frontend
      run: |
        npm install
        npm run build
    
    - name: 🚀 Deploy to Azure Static Site
      run: |
        npm install -g @azure/static-web-apps-cli
        swa deploy --deployment-token ${{ secrets.AZURE_STATIC_WEB_APP_TOKEN }} --env Production
